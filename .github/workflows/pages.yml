name: Deploy PARTENOBIA GOLD V22M to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download pinned GOLD V22M from archive
        run: |
          set -euo pipefail
          python -m pip install --quiet 'gdown==5.2.0'
          gdown --id '1gVNFz1oCs6apfaCDepJFjn_ZLQuU0Gdo' -O /tmp/partenobia-gold-v22m.zip --quiet
          echo 'fc9c9c7dc55b98e194eec8309b28f1444c5183559002dd57edd373ccfd812716  /tmp/partenobia-gold-v22m.zip' | sha256sum -c -
          mkdir -p _site
          unzip -p /tmp/partenobia-gold-v22m.zip PARTENOBIA_V22M_MURO_SINISTRO_VICOLO_TEST.html > _site/index.html
          echo 'b194b71a151322f8e76a1137416cb2c5dfd805c259cbaf9c39820abdd2e04af4  _site/index.html' | sha256sum -c -
          # GOLD file stays checksum-verified; only public page metadata is updated.
          python - <<'PY'
          from pathlib import Path
          page = Path("_site/index.html")
          html = page.read_text(encoding="utf-8")
          old = "<title>PARTENOBIA V22M TEST — Muro sinistro vicolo</title>"
          assert html.count(old) == 1, "Unexpected GOLD V22M HTML title; refusing to alter gameplay build"
          meta = """<title>PARTENOBIA — GOLD V22M</title>
          <meta name="description" content="PARTENOBIA, survival horror ambientato a Napoli. Gioca online alla versione GOLD V22M.">
          <meta property="og:type" content="website">
          <meta property="og:title" content="PARTENOBIA — GOLD V22M">
          <meta property="og:description" content="Survival horror ambientato a Napoli. Gioca a PARTENOBIA GOLD V22M online.">
          <meta property="og:url" content="https://exsiderurgica.github.io/PARTENOBIA-SITE/">
          <meta name="twitter:card" content="summary">
          <meta name="twitter:title" content="PARTENOBIA — GOLD V22M">
          """
          page.write_text(html.replace(old, meta, 1), encoding="utf-8")
          PY
          echo 'e7112f90fa8e7a801d444517d024256bda2533811af1a67f2eb6f33eb73d0bde  _site/index.html' | sha256sum -c -
          touch _site/.nojekyll
          printf 'PARTENOBIA GOLD V22M | 2026-11-10 | sha256 b194b71a151322f8e76a1137416cb2c5dfd805c259cbaf9c39820abdd2e04af4\n' > _site/version.txt
      - name: Upload GOLD V22M website
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ format('github-pages-{0}-{1}', github.run_id, github.run_attempt) }}
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ format('github-pages-{0}-{1}', github.run_id, github.run_attempt) }}

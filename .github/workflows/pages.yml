name: Build and deploy PARTENOBIA GOLD V22U - Edoardo nuovo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify immutable GOLD V22T baseline
        run: |
          set -euo pipefail
          python -m pip install --quiet 'gdown==5.2.0'
          gdown '1fUp-NFrIM0mHDyADMgFHjx8ssRJplfb6' -O /tmp/partenobia-gold-v22t.zip --quiet
          echo '4195db599f8921d3cb2f483a28d25b8c6a6dcd8a7d460f5e5e6d09537eccb0dd  /tmp/partenobia-gold-v22t.zip' | sha256sum -c -
          unzip -p /tmp/partenobia-gold-v22t.zip PARTENOBIA_V22T_PRECARICAMENTO_ZOMBIE_TUTTE_SCENE_TEST.html > /tmp/partenobia-gold-v22t.html
          echo '6515c8be9ffbbc3484472116b6338e894077093f4e5093a73a9804ff911a0a6e  /tmp/partenobia-gold-v22t.html' | sha256sum -c -
      - name: Replace every Edoardo with the approved new GLB
        run: |
          set -euo pipefail
          python scripts/edoardo_nuovo.py --baseline /tmp/partenobia-gold-v22t.html --asset assets/edoardo-nuovo.glb --runtime scripts/edoardo-nuovo.js --output _site/index.html --receipt _site/build.json
          echo '442240998f4e104cc99a66775622db0398cd33c9257247188eed443967dbf169  _site/index.html' | sha256sum -c -
          cp release.json _site/release.json
          touch _site/.nojekyll
          printf 'PARTENOBIA GOLD V22U | Edoardo nuovo | 2026-11-11 | sha256 442240998f4e104cc99a66775622db0398cd33c9257247188eed443967dbf169\n' > _site/version.txt
      - name: Upload verified website
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ format('github-pages-{0}-{1}', github.run_id, github.run_attempt) }}
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ format('github-pages-{0}-{1}', github.run_id, github.run_attempt) }}

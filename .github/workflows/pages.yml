name: Build and deploy PARTENOBIA V23B - San Severo and funicular
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify immutable GOLD V22T baseline
        run: |
          set -euo pipefail
          python -m pip install --quiet 'gdown==5.2.0'
          gdown '1fUp-NFrIM0mHDyADMgFHjx8ssRJplfb6' -O /tmp/partenobia-gold-v22t.zip --quiet
          echo '4195db599f8921d3cb2f483a28d25b8c6a6dcd8a7d460f5e5e6d09537eccb0dd  /tmp/partenobia-gold-v22t.zip' | sha256sum -c -
          unzip -p /tmp/partenobia-gold-v22t.zip PARTENOBIA_V22T_PRECARICAMENTO_ZOMBIE_TUTTE_SCENE_TEST.html > /tmp/partenobia-gold-v22t.html
          echo '6515c8be9ffbbc3484472116b6338e894077093f4e5093a73a9804ff911a0a6e  /tmp/partenobia-gold-v22t.html' | sha256sum -c -
      - name: Replace every Edoardo with the approved new GLB
        run: |
          set -euo pipefail
          python scripts/edoardo_nuovo.py --baseline /tmp/partenobia-gold-v22t.html --asset assets/edoardo-nuovo.glb --runtime scripts/edoardo-nuovo.js --output /tmp/partenobia-v22u.html --receipt /tmp/v22u-build.json
          echo '442240998f4e104cc99a66775622db0398cd33c9257247188eed443967dbf169  /tmp/partenobia-v22u.html' | sha256sum -c -
      - name: Replace church Diego and share Pulcinella footfalls
        run: |
          set -euo pipefail
          python scripts/diego_v2_footsteps.py --baseline /tmp/partenobia-v22u.html --asset assets/zombie-diego-v2.glb --runtime scripts/diego-v2-footsteps.js --output /tmp/partenobia-v22w.html --receipt /tmp/v22w-build.json
          echo '76d4fa244610195322f1aa955bdf40725cc187d28873c2a5fd433da919f17fca  /tmp/partenobia-v22w.html' | sha256sum -c -
      - name: Replace only the cab fishmonger with Edoardo nuovo
        run: |
          set -euo pipefail
          python scripts/edoardo_vagone.py --baseline /tmp/partenobia-v22w.html --output /tmp/partenobia-v22x.html --receipt /tmp/v22x-build.json
          echo '41ea64dc502648e07b3b669ad0c8ce4a91ad1942138899ea8d35a4f76e7cb65c  /tmp/partenobia-v22x.html' | sha256sum -c -
      - name: Replace remaining fishmongers with Zombie Pescivendolo V2
        run: |
          set -euo pipefail
          python scripts/pescivendolo_v2.py --baseline /tmp/partenobia-v22x.html --asset assets/zombie-pescivendolo-v2.glb --runtime scripts/pescivendolo-v2.js --output /tmp/partenobia-v22y.html --receipt /tmp/v22y-build.json
          echo '42cfb06dfacecd9e9053d5c109cf944263979c27cae7481fe748aaa1dd60d964  /tmp/partenobia-v22y.html' | sha256sum -c -
      - name: Calibrate Diego V2 hanging arm pose
        run: |
          set -euo pipefail
          python scripts/diego_braccia.py --baseline /tmp/partenobia-v22y.html --runtime scripts/diego-v2-arms.js --output /tmp/partenobia-v22z.html --receipt /tmp/v22z-build.json
          echo '3b6e9e3401865f8cf18897c02cbcbd0dab6d3d34ac373449491221be34b5e8dc  /tmp/partenobia-v22z.html' | sha256sum -c -
      - name: Hang Diego arms forward and share church perspective scale
        run: |
          set -euo pipefail
          python scripts/diego_braccia_avanti.py --baseline /tmp/partenobia-v22z.html --runtime scripts/diego-v2-forward-arms.js --output /tmp/partenobia-v23a.html --receipt /tmp/v23a-build.json
          echo '5c910cdc7e0afef48cb181e053f0f5f603a93b5d428a56e8359f9f2f2ee89b8a  /tmp/partenobia-v23a.html' | sha256sum -c -
      - name: San Severo fishmonger, 30 second ride, left spawn and softer arms
        run: |
          set -euo pipefail
          python scripts/v23b_updates.py --baseline /tmp/partenobia-v23a.html --runtime scripts/v23b-spawn.js --output _site/index.html --receipt _site/build.json
          echo 'bc39e3abb465c73f9eadb6c6bb6c47a46cd4693573f30b440f1df37fa24ef4ce  _site/index.html' | sha256sum -c -
          cp release.json _site/release.json
          touch _site/.nojekyll
          printf 'PARTENOBIA V23B TEST | San Severo e funicolare | 2026-11-12\n' > _site/version.txt
      - name: Upload verified website
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ format('github-pages-{0}-{1}', github.run_id, github.run_attempt) }}
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ format('github-pages-{0}-{1}', github.run_id, github.run_attempt) }}
